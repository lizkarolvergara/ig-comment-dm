<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comentario a DM</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #1d1b19; --muted: #6b665f; --line: #e7e2da;
    --accent: #e8590c; --accent-ink: #ffffff; --ok: #2b8a3e; --err: #c92a2a; --warn: #b7791f; --chip: #f1ece4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161514; --card: #1f1d1b; --text: #f1eee9; --muted: #a39d94; --line: #34302c;
      --accent: #ff8a3d; --accent-ink: #1d1b19; --ok: #69db7c; --err: #ff8787; --warn: #ffd43b; --chip: #2a2724; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; } h1 span { color: var(--accent); }
  h2 { font-size: 17px; margin: 28px 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .stat b { display: block; font-size: 22px; } .stat small { color: var(--muted); }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 8px 14px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.link { border: none; background: none; color: var(--muted); padding: 4px 6px; }
  button:disabled { opacity: .6; cursor: wait; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; } label small { font-weight: 400; color: var(--muted); }
  input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
  textarea { min-height: 70px; resize: vertical; }
  .rule { display: grid; grid-template-columns: 64px 1fr auto; gap: 8px 16px; align-items: start; }
  .thumb { width: 64px; height: 80px; border-radius: 8px; background: var(--chip); object-fit: cover; display: block; }
  .thumb.empty { display: grid; place-items: center; color: var(--muted); font-size: 22px; }
  .more { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 4px; }
  .rule + .rule { margin-top: 12px; }
  a { color: var(--accent); }
  .rule .kw { font-weight: 700; } .rule .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  @media (max-width: 600px) { .rule { grid-template-columns: 56px 1fr; } .thumb { width: 56px; height: 70px; } .rule .actions { grid-column: 2; justify-content: start; } .rule .actions button.link:first-child { padding-left: 0; } }
  .rule .actions { display: flex; gap: 4px; align-items: start; flex-wrap: wrap; justify-content: end; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 9px; font-size: 12px; margin: 2px 4px 0 0; }
  .off { opacity: .55; }
  .ok { color: var(--ok); } .err { color: var(--err); } .warn { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .scroll { overflow-x: auto; }
  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--text); width: min(560px, calc(100vw - 32px)); padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .row { display: flex; gap: 8px; justify-content: end; margin-top: 16px; }
  .msg { margin-top: 10px; min-height: 1.2em; }
  #login { max-width: 380px; margin: 12vh auto 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="login" class="card hidden">
    <h1>Comentario <span>→</span> DM</h1>
    <form id="loginForm">
      <label for="pw">Contraseña</label>
      <input id="pw" type="password" autocomplete="current-password" required autofocus>
      <div class="row"><button class="primary" type="submit">Entrar</button></div>
      <div class="msg err" id="loginMsg"></div>
    </form>
  </section>

  <section id="app" class="hidden">
    <header>
      <h1>Comentario <span>→</span> DM <small id="account" style="color:var(--muted);font-weight:400;font-size:15px"></small></h1>
      <button class="link" id="logout">Salir</button>
    </header>

    <div class="grid" id="stats"></div>

    <h2>Reglas por post <button class="primary" id="newRule">+ Nueva regla</button></h2>
    <div class="card" id="rules"><p style="color:var(--muted)">Cargando…</p></div>

    <h2>Registro <a class="btn" href="/api/status?format=csv">Descargar CSV</a></h2>
    <div class="card scroll"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Comentario</th><th>Regla</th><th>DM</th><th>Pública</th><th>Error</th></tr></thead><tbody id="events"></tbody></table></div>
  </section>
</main>

<dialog id="editor">
  <form id="ruleForm" method="dialog">
    <h2 style="margin-top:0" id="editorTitle">Nueva regla</h2>
    <label for="f_post">Link del post</label>
    <input id="f_post" placeholder="https://www.instagram.com/reel/…" required>
    <label for="f_kw">Palabra clave <small>· variantes separadas por comas: LUPA, LUPPA</small></label>
    <textarea id="f_kw" required style="min-height:90px"></textarea>
    <label for="f_dm">Mensaje del DM <small>· usa {usuario} para poner su @</small></label>
    <textarea id="f_dm" maxlength="1000" required></textarea>
    <label for="f_pub">Respuesta pública <small>· varias opciones separadas por | · {usuario} = su @</small></label>
    <textarea id="f_pub" required></textarea>
    <label for="f_fb">Respuesta si el DM no llega <small>· opcional</small></label>
    <textarea id="f_fb" placeholder="Por defecto: {usuario} ¡No pude enviarte el mensaje! 😢 Escríbeme por DM y te lo paso."></textarea>
    <div class="msg err" id="formMsg"></div>
    <div class="row">
      <button type="button" id="cancel">Cancelar</button>
      <button class="primary" type="submit" id="save">Guardar</button>
    </div>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = (d) => d ? new Date(d).toLocaleString("es", { dateStyle: "short", timeStyle: "short" }) : "—";
let rules = [];
let editing = null;

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== "/api/login") { show("login"); throw new Error("401"); }
  if (!res.ok) throw new Error(data.error || "Error " + res.status);
  return data;
}

function show(which) {
  $("#login").classList.toggle("hidden", which !== "login");
  $("#app").classList.toggle("hidden", which !== "app");
}

async function load() {
  const [st, rs] = await Promise.all([api("/api/status"), api("/api/rules")]);
  show("app");
  rules = rs.rules;
  $("#account").textContent = st.account ? "@" + st.account : "";
  const pollOk = st.poll.at && Date.now() - new Date(st.poll.at) < 5 * 60000 && !st.poll.error;
  $("#stats").innerHTML = `
    <div class="card stat"><small>Lector</small><b class="${pollOk ? "ok" : "err"}">${pollOk ? "Activo" : "Revisar"}</b><small>${st.poll.error ? esc(st.poll.error) : "Último chequeo " + fmt(st.poll.at)}</small></div>
    <div class="card stat"><small>Token</small><b class="${st.token.error ? "err" : "ok"}">${st.token.error ? "Error" : st.token.daysLeft == null ? "No caduca" : st.token.daysLeft + " días"}</b><small>${st.token.error ? esc(st.token.error) : "Verificado " + fmt(st.token.checkedAt)}</small></div>
    <div class="card stat"><small>DMs enviados</small><b>${st.totals.dm}</b><small>${st.totals.matched} coincidencias</small></div>
    <div class="card stat"><small>Sin DM / con error</small><b class="${st.totals.withError ? "warn" : ""}">${st.totals.fallback} / ${st.totals.withError}</b><small>respuesta alternativa / error</small></div>`;
  renderRules();
  const byId = Object.fromEntries(rules.map((r) => [r.id, r.keyword.split(",")[0]]));
  $("#events").innerHTML = st.events.length ? st.events.map((e) => `<tr>
      <td>${fmt(e.created_at)}</td><td>@${esc(e.username)}</td><td>${esc(e.text)}</td><td>${esc(byId[e.keyword_id] ?? "")}</td>
      <td>${e.dm_sent ? '<span class="ok">✓</span>' : e.dm_undeliverable ? '<span class="warn">no llegó</span>' : "…"}</td>
      <td>${e.replied ? '<span class="ok">✓</span>' : "…"}</td><td class="err">${esc(e.error)}</td></tr>`).join("")
    : `<tr><td colspan="7" style="color:var(--muted)">Todavía no hay envíos.</td></tr>`;
}

const shortUrl = (u) => { const m = String(u || "").match(/instagram\.com\/(?:[^/]+\/)?((?:p|reel|reels|tv)\/[A-Za-z0-9_-]+)/); return m ? "instagram.com/" + m[1] : u; };

function renderRules() {
  if (!rules.length) { $("#rules").innerHTML = `<p style="color:var(--muted);margin:0">No hay reglas. Crea una con “+ Nueva regla”.</p>`; return; }
  $("#rules").innerHTML = rules.map((r) => {
    const kws = r.keyword.split(",").map((k) => k.trim()).filter(Boolean);
    const more = kws.length > 1 ? `<span class="more">+${kws.length - 1} variante${kws.length > 2 ? "s" : ""}</span>` : "";
    const thumb = r.media_id
      ? `<a href="${esc(r.post_url)}" target="_blank" rel="noopener"><img class="thumb" loading="lazy" alt="" src="/api/thumb?media=${esc(r.media_id)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb empty',textContent:'🖼'}))"></a>`
      : `<div class="thumb empty">${r.post_url ? "🖼" : "∗"}</div>`;
    return `
    <div class="rule ${r.active ? "" : "off"}">
      ${thumb}
      <div>
        <div class="kw"><span class="chip">${esc(kws[0] ?? "")}</span>${more}</div>
        <div class="meta"><a href="${esc(r.post_url)}" target="_blank" rel="noopener">${esc(shortUrl(r.post_url) || "todos los posts")}</a>
          ${r.resolve_error ? `<span class="err"> · ${esc(r.resolve_error)}</span>` : ""}</div>
        <div class="meta">DM: ${esc(r.dm_message).slice(0, 140)}</div>
        <div class="meta">${r.stats.dm} DMs · ${r.stats.fallback} sin DM · ${r.stats.pending} pendientes ${r.active ? "" : "· <b>desactivada</b>"}</div>
      </div>
      <div class="actions">
        <button class="link" data-act="edit" data-id="${r.id}">Editar</button>
        <button class="link" data-act="toggle" data-id="${r.id}">${r.active ? "Desactivar" : "Activar"}</button>
        <button class="link" data-act="delete" data-id="${r.id}">Borrar</button>
      </div>
    </div>`;
  }).join("");
}

function openEditor(rule) {
  editing = rule;
  $("#editorTitle").textContent = rule ? "Editar regla" : "Nueva regla";
  $("#f_post").value = rule?.post_url ?? "";
  $("#f_kw").value = rule?.keyword ?? "";
  $("#f_dm").value = rule?.dm_message ?? "";
  $("#f_pub").value = rule?.public_reply ?? "";
  $("#f_fb").value = rule?.fallback_reply ?? "";
  $("#formMsg").textContent = "";
  $("#editor").showModal();
}

$("#loginForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("#loginMsg").textContent = "";
  try { await api("/api/login", { method: "POST", body: JSON.stringify({ password: $("#pw").value }) }); $("#pw").value = ""; await load(); }
  catch (e) { $("#loginMsg").textContent = e.message; }
});
$("#logout").addEventListener("click", async () => { await api("/api/login", { method: "DELETE" }); show("login"); });
$("#newRule").addEventListener("click", () => openEditor(null));
$("#cancel").addEventListener("click", () => $("#editor").close());

$("#ruleForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const body = { post_url: $("#f_post").value, keyword: $("#f_kw").value, dm_message: $("#f_dm").value, public_reply: $("#f_pub").value, fallback_reply: $("#f_fb").value };
  $("#save").disabled = true; $("#formMsg").textContent = "Comprobando el post…";
  try {
    if (editing) await api("/api/rules?id=" + editing.id, { method: "PATCH", body: JSON.stringify(body) });
    else await api("/api/rules", { method: "POST", body: JSON.stringify(body) });
    $("#editor").close(); await load();
  } catch (e) { $("#formMsg").textContent = e.message; }
  finally { $("#save").disabled = false; }
});

$("#rules").addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-act]"); if (!b) return;
  const r = rules.find((x) => x.id === Number(b.dataset.id));
  try {
    if (b.dataset.act === "edit") return openEditor(r);
    if (b.dataset.act === "toggle") await api("/api/rules?id=" + r.id, { method: "PATCH", body: JSON.stringify({ active: !r.active }) });
    if (b.dataset.act === "delete") {
      if (!confirm("¿Borrar esta regla? Si ya envió DMs, mejor desactívala.")) return;
      await api("/api/rules?id=" + r.id, { method: "DELETE" });
    }
    await load();
  } catch (e) { if (e.message !== "401") alert(e.message); }
});

load().catch((e) => { if (e.message !== "401") { show("login"); $("#loginMsg").textContent = e.message; } });
setInterval(() => { if (!$("#app").classList.contains("hidden") && !$("#editor").open) load().catch(() => {}); }, 30000);
</script>
</body>
</html>
